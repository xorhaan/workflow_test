# v4:


name: Create branch sync PRs

on:
  pull_request:
    types:
      - closed
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  create-sync-prs:
    if: >
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == 'main'

    runs-on: ubuntu-latest

    strategy:
      matrix:
        target:
          - dev
          - uat

    concurrency:
      group: sync-main-to-${{ matrix.target }}
      cancel-in-progress: false

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Fetch target branch
        run: |
          git fetch origin "${{ matrix.target }}"

      - name: Check whether target already contains main
        id: check
        env:
          TARGET: ${{ matrix.target }}
        run: |
          if git merge-base --is-ancestor origin/main "origin/$TARGET"; then
            echo "required=false" >> "$GITHUB_OUTPUT"
            echo "$TARGET already contains the latest main commit."
          else
            echo "required=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check for existing sync PR
        if: steps.check.outputs.required == 'true'
        id: existing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET: ${{ matrix.target }}
        run: |
          count="$(
            gh pr list \
              --base "$TARGET" \
              --state open \
              --search "head:sync/main-to-$TARGET/" \
              --json number \
              --jq 'length'
          )"

          echo "count=$count" >> "$GITHUB_OUTPUT"

      - name: Create disposable sync branch
        if: >
          steps.check.outputs.required == 'true' &&
          steps.existing.outputs.count == '0'
        id: branch
        env:
          TARGET: ${{ matrix.target }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          branch="sync/main-to-$TARGET/$RUN_ID-$RUN_ATTEMPT"

          git checkout -B "$branch" origin/main
          git push origin "$branch"

          echo "name=$branch" >> "$GITHUB_OUTPUT"

      - name: Create synchronization PR
        if: steps.branch.outputs.name != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET: ${{ matrix.target }}
          SYNC_BRANCH: ${{ steps.branch.outputs.name }}
          MERGED_PR: ${{ github.event.pull_request.number }}
        run: |
          gh pr create \
            --base "$TARGET" \
            --head "$SYNC_BRANCH" \
            --title "Sync main into $TARGET" \
            --body "Automated synchronization from main into $TARGET after PR #$MERGED_PR was merged.

          Important: The source is a disposable synchronization branch. If conflicts are resolved in the GitHub UI, main will not be modified."