name: Create branch sync PRs

on:
  # pull_request_target (not pull_request) so PRs merged from forks still get a
  # write-capable token. Safe here: we never check out or run PR head code —
  # only the trusted `main` branch is checked out below.
  pull_request_target:
    types:
      - closed
    branches:
      - main

permissions:
  contents: write
  pull-requests: write
  issues: write # needed to create/apply the conflict label

jobs:
  create-sync-prs:
    if: >
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - dev
          - uat
    concurrency:
      group: sync-main-to-${{ matrix.target }}
      cancel-in-progress: false
    env:
      TARGET: ${{ matrix.target }}
      SYNC_BRANCH: sync/main-to-${{ matrix.target }}
      # Pushes, PRs and merges made with the default GITHUB_TOKEN do NOT trigger
      # other workflows, so required checks would never run on the sync PR and
      # auto-merge would wait forever (and merges into dev/uat would not trigger
      # deploys). Provide a GitHub App token or fine-grained PAT as
      # SYNC_BOT_TOKEN; GITHUB_TOKEN is only a fallback.
      GH_TOKEN: ${{ secrets.SYNC_BOT_TOKEN || secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.SYNC_BOT_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch target and sync branches
        run: |
          git fetch origin "+refs/heads/$TARGET:refs/remotes/origin/$TARGET"
          git fetch origin "+refs/heads/$SYNC_BRANCH:refs/remotes/origin/$SYNC_BRANCH" || true

      # Content-based check instead of commit/merge-base counting. We simulate
      # merging main into the target: if the result is identical to the target
      # tree, main has nothing new for it. This stays correct even if an earlier
      # sync PR was squash-merged (squash breaks ancestry, so rev-list/three-dot
      # diff would report the same changes as "missing" forever).
      - name: Check whether synchronization is required
        id: check
        run: |
          target_tree="$(git rev-parse "origin/$TARGET^{tree}")"
          set +e
          merged_tree="$(git merge-tree --write-tree "origin/$TARGET" origin/main | head -n1)"
          rc=${PIPESTATUS[0]}
          set -e
          if [ "$rc" -gt 1 ]; then
            echo "::error::git merge-tree failed (exit $rc)"
            exit 1
          fi
          if [ "$rc" -eq 0 ] && [ "$merged_tree" = "$target_tree" ]; then
            echo "required=false" >> "$GITHUB_OUTPUT"
            echo "No effective synchronization is required for $TARGET."
          else
            echo "required=true" >> "$GITHUB_OUTPUT"
            echo "Synchronization is required for $TARGET."
          fi

      - name: Update synchronization branch
        if: steps.check.outputs.required == 'true'
        id: branch
        run: |
          old_sha="$(git rev-parse -q --verify "refs/remotes/origin/$SYNC_BRANCH" || true)"

          # Human commits on the sync branch that are not in main or the target yet,
          # e.g. a conflict resolution made with "Resolve conflicts". Commits made by
          # this workflow (github-actions[bot]) are rebuilt on every run.
          manual=""
          if [ -n "$old_sha" ]; then
            manual="$(
              git log --format='%h %an' "$old_sha" --not origin/main "origin/$TARGET" |
                grep -v ' github-actions\[bot\]$' || true
            )"
          fi

          kept=false
          if [ -n "$manual" ]; then
            echo "Keeping manual commits on $SYNC_BRANCH:"
            echo "$manual"
            git checkout -B "$SYNC_BRANCH" "$old_sha"
            if git merge --no-edit origin/main; then
              kept=true
            else
              git merge --abort
              echo "::warning::Manual commits on $SYNC_BRANCH conflict with new main changes; rebuilding from main."
            fi
          fi
          if [ "$kept" = false ]; then
            git checkout -B "$SYNC_BRANCH" origin/main
          fi

          # Merge the target into the sync branch here, using git's own merge.
          # Feature branches merged into both main and the target give the two
          # branches several merge bases ("criss-cross" history). Git resolves that
          # correctly, but GitHub's mergeability check can pick one stale base and
          # report conflicts that don't exist. Once the target is merged in, the PR's
          # only merge base is the target's tip, so GitHub sees what we see.
          if git merge --no-edit -m "Merge $TARGET into $SYNC_BRANCH" "origin/$TARGET"; then
            echo "conflicts=false" >> "$GITHUB_OUTPUT"
          else
            # Real conflicts: push main as is and leave them for a human in the PR.
            git merge --abort
            echo "conflicts=true" >> "$GITHUB_OUTPUT"
          fi

          # The lease makes the push fail if someone pushed to the branch meanwhile.
          git push \
            --force-with-lease="refs/heads/$SYNC_BRANCH:$old_sha" \
            origin \
            "HEAD:refs/heads/$SYNC_BRANCH"

      - name: Create or update synchronization PR
        if: steps.check.outputs.required == 'true'
        id: pr
        env:
          MERGED_PR: ${{ github.event.pull_request.number }}
        run: |
          body="$(cat <<EOF
          Automated synchronization from \`main\` into \`$TARGET\`.

          Last updated after #$MERGED_PR was merged into \`main\`.

          The source branch, \`$SYNC_BRANCH\`, is managed automatically:
          - If there are no conflicts, this PR auto-merges (merge commit) once all required checks pass.
          - If there are conflicts, it stays open and is labelled \`sync-conflict\`. Resolve them on \`$SYNC_BRANCH\`
            (e.g. the "Resolve conflicts" button on this PR); the workflow will keep your resolution on later updates.

          Do not add development commits to the synchronization branch. **Do not squash-merge this PR.**
          EOF
          )"

          number="$(
            gh pr list \
              --base "$TARGET" \
              --head "$SYNC_BRANCH" \
              --state open \
              --json number \
              --jq '.[0].number // empty'
          )"

          if [ -z "$number" ]; then
            gh pr create \
              --base "$TARGET" \
              --head "$SYNC_BRANCH" \
              --title "Sync main into $TARGET" \
              --body "$body"
            number="$(
              gh pr list \
                --base "$TARGET" \
                --head "$SYNC_BRANCH" \
                --state open \
                --json number \
                --jq '.[0].number'
            )"
            echo "Created synchronization PR #$number."
          else
            gh pr edit "$number" --body "$body"
            echo "Updated existing synchronization PR #$number."
          fi
          echo "number=$number" >> "$GITHUB_OUTPUT"

      - name: Enable auto-merge (no conflicts)
        id: automerge
        if: >
          steps.check.outputs.required == 'true' &&
          steps.branch.outputs.conflicts == 'false'
        env:
          PR: ${{ steps.pr.outputs.number }}
        run: |
          gh pr edit "$PR" --remove-label sync-conflict 2>/dev/null || true
          # --merge (not --squash) keeps main's history connected to the target,
          # so future syncs only contain genuinely new changes.
          # If auto-merge can't be enabled (e.g. the PR is already mergeable with no
          # pending required checks), merge directly. Branch protection still applies.
          if gh pr merge "$PR" --auto --merge || gh pr merge "$PR" --merge; then
            echo "Auto-merge requested for PR #$PR into $TARGET." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "failed=true" >> "$GITHUB_OUTPUT"
            echo "::warning::Could not merge or enable auto-merge for PR #$PR."
          fi

      - name: Flag conflicts and notify
        if: >
          steps.check.outputs.required == 'true' &&
          (steps.branch.outputs.conflicts == 'true' || steps.automerge.outputs.failed == 'true')
        env:
          CONFLICTS: ${{ steps.branch.outputs.conflicts }}
          PR: ${{ steps.pr.outputs.number }}
          MERGED_BY: ${{ github.event.pull_request.merged_by.login }}
          # Optional repo variable, e.g. "@my-org/backend-team" or "@alice @bob".
          NOTIFY: ${{ vars.SYNC_CONFLICT_NOTIFY }}
        run: |
          gh label create sync-conflict \
            --color B60205 \
            --description "Automated branch sync has merge conflicts" \
            --force
          gh pr edit "$PR" --add-label sync-conflict
          gh pr edit "$PR" --add-assignee "$MERGED_BY" || true
          gh pr merge "$PR" --disable-auto 2>/dev/null || true

          if [ "$CONFLICTS" = true ]; then
            problem=":warning: **Merge conflicts** between \`main\` and \`$TARGET\` — this sync PR will not merge automatically."
            ask="please resolve the conflicts on \`$SYNC_BRANCH\` and merge this PR"
          else
            problem=":warning: This sync PR could not be merged automatically (see the workflow run: checks, branch protection or repo auto-merge setting)."
            ask="please check and merge this PR"
          fi
          gh pr comment "$PR" --body "$(cat <<EOF
          $problem

          @$MERGED_BY ${NOTIFY} $ask (use **merge commit**, not squash).
          EOF
          )"

          echo "::warning::Sync PR #$PR into $TARGET needs manual attention."
          echo ":warning: Sync PR #$PR into \`$TARGET\` needs manual attention — left open." >> "$GITHUB_STEP_SUMMARY"