name: Create branch sync PRs

on:
  pull_request:
    types:
      - closed
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  create-sync-prs:
    if: >
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == 'main'

    runs-on: ubuntu-latest

    strategy:
      matrix:
        target:
          - dev
          - uat

    concurrency:
      group: sync-main-to-${{ matrix.target }}
      cancel-in-progress: false

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Fetch target branch
        run: |
          git fetch origin "${{ matrix.target }}"
      
      - name: Check for actual file differences
        id: diff
        env:
          TARGET: ${{ matrix.target }}
        run: |
          # Three-dot diff = changes reachable from main since the merge-base,
          # matching what the resulting PR would actually show. This avoids
          # opening PRs whose "files changed" tab is empty even though commits
          # are missing (e.g. merge commits with no net effect).
          FILES_CHANGED=$(git diff --name-only origin/$TARGET...origin/main | wc -l | tr -d ' ')

          echo "files_changed=$FILES_CHANGED" >> "$GITHUB_OUTPUT"

          if [ "$FILES_CHANGED" -eq 0 ]; then
            echo "required=false" >> "$GITHUB_OUTPUT"
            echo "No effective changes to sync."
          else
            echo "required=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check whether target is missing changes from main
        id: check
        env:
          TARGET: ${{ matrix.target }}
        run: |
          MAIN_AHEAD_COUNT=$(
            git rev-list --right-only --count origin/$TARGET...origin/main
          )
          echo "main_ahead_count=$MAIN_AHEAD_COUNT"
          if [ "$MAIN_AHEAD_COUNT" -gt 0 ]; then
            echo "required=true" >> "$GITHUB_OUTPUT"
            echo "Main contains $MAIN_AHEAD_COUNT commit(s) not present in $TARGET"
          else
            echo "required=false" >> "$GITHUB_OUTPUT"
            echo "$TARGET already contains everything from main"
          fi

      - name: Check for patches already present in target (cherry-picks)
        if: >
          steps.check.outputs.required == 'true' &&
          steps.diff.outputs.required == 'true'
        id: patch
        env:
          TARGET: ${{ matrix.target }}
        run: |
          # Commit-SHA comparison (above) misses changes that were cherry-picked
          # into the target, because cherry-picking produces a new commit SHA.
          # --cherry-pick compares by patch content instead of SHA, so commits
          # whose patch already exists in the target are excluded.
          # Note: this handles cherry-picks but NOT squash-merges (where the
          # combined patch differs); the file-diff check remains the fallback.
          MISSING_PATCH_COUNT=$(
            git rev-list --right-only --cherry-pick --count origin/$TARGET...origin/main
          )
          echo "missing_patch_count=$MISSING_PATCH_COUNT"
          if [ "$MISSING_PATCH_COUNT" -gt 0 ]; then
            echo "required=true" >> "$GITHUB_OUTPUT"
            echo "$MISSING_PATCH_COUNT patch(es) from main are truly absent from $TARGET"
          else
            echo "required=false" >> "$GITHUB_OUTPUT"
            echo "All of main's patches are already present in $TARGET (e.g. cherry-picked)"
          fi

      - name: Check for existing sync PR
        if: >
          steps.check.outputs.required == 'true' &&
          steps.diff.outputs.required == 'true' &&
          steps.patch.outputs.required == 'true'
        id: existing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET: ${{ matrix.target }}
        run: |
          # Prefix-match on the sync branch name; GitHub search's head:
          # qualifier only does exact matching, so filter locally instead.
          count="$(
            gh pr list \
              --base "$TARGET" \
              --state open \
              --limit 100 \
              --json headRefName \
              --jq '[.[] | select(.headRefName | startswith("sync/main-to-'"$TARGET"'/"))] | length'
          )"

          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "Found $count existing sync PR(s) targeting $TARGET"

      - name: Create disposable sync branch
        if: >
          steps.check.outputs.required == 'true' &&
          steps.diff.outputs.required == 'true' &&
          steps.patch.outputs.required == 'true' &&
          steps.existing.outputs.count == '0'
        id: branch
        env:
          TARGET: ${{ matrix.target }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          branch="sync/main-to-$TARGET/$RUN_ID-$RUN_ATTEMPT"

          git checkout -B "$branch" origin/main
          git push origin "$branch"

          echo "name=$branch" >> "$GITHUB_OUTPUT"

      - name: Create synchronization PR
        if: steps.branch.outputs.name != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET: ${{ matrix.target }}
          SYNC_BRANCH: ${{ steps.branch.outputs.name }}
          MERGED_PR: ${{ github.event.pull_request.number }}
        run: |
          gh pr create \
            --base "$TARGET" \
            --head "$SYNC_BRANCH" \
            --title "Sync main into $TARGET" \
            --body "$(cat <<EOF
          Automated synchronization from main into \`$TARGET\` after PR #$MERGED_PR was merged.

          Important: the source (\`$SYNC_BRANCH\`) is a disposable copy of main. If conflicts are resolved in the GitHub UI, main itself will not be modified.

          This branch can be safely deleted once the PR is merged or closed.
          EOF
          )"