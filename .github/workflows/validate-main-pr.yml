# v3

name: Create Sync PRs from Main

on:
  pull_request:
    branches:
      - main
    types:
      - closed

permissions:
  contents: read
  pull-requests: write

jobs:
  create-sync-prs:
    # Run only when the PR was merged
    if: github.event.pull_request.merged == true

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch branches
        run: |
          git fetch origin main
          git fetch origin dev
          git fetch origin uat

      - name: Create PR main -> dev
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git merge-base --is-ancestor origin/main origin/dev; then
            echo "dev already contains all commits from main"
            exit 0
          fi

          EXISTING_PR=$(gh pr list \
            --base dev \
            --head main \
            --state open \
            --json number \
            --jq 'length')

          if [ "$EXISTING_PR" -gt 0 ]; then
            echo "PR main -> dev already exists"
            exit 0
          fi

          gh pr create \
            --base dev \
            --head main \
            --title "Sync main into dev" \
            --body "Auto-generated PR to sync latest changes from main into dev."

      - name: Create PR main -> uat
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git merge-base --is-ancestor origin/main origin/uat; then
            echo "uat already contains all commits from main"
            exit 0
          fi

          EXISTING_PR=$(gh pr list \
            --base uat \
            --head main \
            --state open \
            --json number \
            --jq 'length')

          if [ "$EXISTING_PR" -gt 0 ]; then
            echo "PR main -> uat already exists"
            exit 0
          fi

          gh pr create \
            --base uat \
            --head main \
            --title "Sync main into uat" \
            --body "Auto-generated PR to sync latest changes from main into uat."